name: Build & Release FitLog Pro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp app/build/outputs/apk/debug/app-debug.apk build-output/FitLogPro-v1.0.0-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitLogPro-v1.0.0-debug.apk
          path: build-output/FitLogPro-v1.0.0-debug.apk
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "FitLog Pro v1.0.0"
          body: "Official Android APK release for FitLog Pro workout tracker."
          files: build-output/FitLogPro-v1.0.0-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace
